<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiveM 스토리RP 통합 법률 계산기</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --danger-color: #ef4444;
            --success-color: #34d399;
            --warning-color: #f59e0b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #60a5fa;
        }
        .main-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }
        .category-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .category-box h3 {
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            color: #93c5fd;
        }
        .crime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 10px;
        }
        .crime-item {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .crime-item:hover {
            border-color: var(--accent-color);
            background-color: #1e3a8a;
        }
        .crime-item input[type="checkbox"] {
            margin-right: 5px;
            cursor: pointer;
        }
        .crime-info {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        /* 결과 패널 스타일 */
        .result-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .result-panel h2 {
            margin-top: 0;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            font-size: 1.1rem;
        }
        .result-value {
            font-weight: bold;
            color: #60a5fa;
        }
        .common-account-box {
            background-color: rgba(245, 158, 11, 0.1);
            border: 1px dashed var(--warning-color);
            padding: 10px;
            border-radius: 6px;
            margin: 15px 0;
        }
        .warning-text {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: background 0.2s;
        }
        .btn-copy {
            background-color: var(--accent-color);
            color: white;
        }
        .btn-copy:hover {
            background-color: var(--accent-hover);
        }
        .btn-reset {
            background-color: var(--danger-color);
            color: white;
        }
        .btn-reset:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>FiveM 스토리RP 통합 법률 계산기</h1>
    
    <div class="main-layout">
        <!-- 죄목 선택 영역 -->
        <div id="crime-sections"></div>

        <!-- 결과 출력 영역 -->
        <div class="result-panel">
            <h2>⚖️ 최종 처벌 내역</h2>
            <div class="result-row">
                <span>총 벌금:</span>

            </div>
            
            <!-- 공통계좌 20% 적립 패널 -->
            <div class="common-account-box">

        </div>
    </div>
</div>
